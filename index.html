<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radiohead 2027 Tour</title>
<style>
*{margin:0;box-sizing:border-box}
html,body{height:100%;background:#000;overflow:hidden}
img{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;display:none;user-select:none;-webkit-user-drag:none}
img.on{display:block}
iframe{position:fixed;left:50%;top:50%;width:min(100vw,177.7778vh);height:min(100vh,56.25vw);transform:translate(-50%,-50%);border:0;background:#0A0A0A;visibility:hidden;pointer-events:none}
iframe.on{visibility:visible}
#fs{display:none}
body.ui #fs{opacity:1}
body.ui{cursor:default}
</style></head><body>

<script>
const N=9;let cur=0;const imgs=[];const ANIM={2:'slides/02.html',6:'slides/06.html'};
function fit(){}
for(let i=1;i<=N;i++){let el;if(ANIM[i]){el=document.createElement('iframe');el.src=ANIM[i];el.setAttribute('scrolling','no');el.onload=()=>{if(imgs[cur]===el){try{el.contentWindow.postMessage('play','*')}catch(e){}}}}else{el=new Image();el.src='slides/'+String(i).padStart(2,'0')+'.png';el.draggable=false}document.body.appendChild(el);imgs.push(el)}
addEventListener('resize',fit);fit();
function go(n){cur=Math.max(0,Math.min(N-1,n));imgs.forEach((im,i)=>im.classList.toggle('on',i===cur));const c=imgs[cur];if(c.tagName==='IFRAME'){try{c.contentWindow.postMessage('play','*')}catch(e){}}try{history.replaceState(null,'','#'+(cur+1))}catch(e){}}
function toggleFs(){const d=document,r=d.documentElement;if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}else{const q=(r.requestFullscreen||r.webkitRequestFullscreen).call(r);if(q&&q.catch)q.catch(()=>{fsb.textContent='Safari: Ctrl+Cmd+F'})}}
const fsb={textContent:'',addEventListener(){}};

['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{fsb.textContent=(document.fullscreenElement||document.webkitFullscreenElement)?'Exit full screen (F)':'Full screen (F)'}));
let t;addEventListener('mousemove',()=>{document.body.classList.add('ui');clearTimeout(t);t=setTimeout(()=>document.body.classList.remove('ui'),2000)});
addEventListener('keydown',e=>{
 if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
 else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
 else if(e.key==='Home')go(0);else if(e.key==='End')go(N-1);
 else if(e.code==='KeyF'||e.key==='f'||e.key==='F'||e.key==='а'||e.key==='А')toggleFs();
});
addEventListener('click',e=>go(e.clientX>innerWidth/2?cur+1:cur-1));
let tx=null;addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>40)go(d<0?cur+1:cur-1);tx=null});
go((parseInt(location.hash.slice(1))||1)-1);
</script></body></html>
